<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marathon Assessment — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f5f0e8; color: #1a1612; min-height: 100vh; }

    /* LOGIN */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #1a1612;
    }
    .login-box {
      background: #2a2420; border: 1px solid rgba(200,168,75,0.3);
      padding: 48px; width: 360px; text-align: center;
    }
    .login-box h1 { font-size: 20px; color: #e8d48a; margin-bottom: 8px; }
    .login-box p { font-size: 13px; color: #8a7a6a; margin-bottom: 32px; }
    .login-box input {
      width: 100%; padding: 12px 16px; background: #1a1612;
      border: 1px solid #5a4d42; color: #e8e0d0; font-size: 14px;
      margin-bottom: 16px; outline: none;
    }
    .login-box input:focus { border-color: #c8a84b; }
    .login-btn {
      width: 100%; padding: 12px; background: #c8a84b; color: #1a1612;
      border: none; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .login-btn:hover { background: #e8d48a; }
    .login-error { color: #e05a4a; font-size: 13px; margin-top: 12px; display: none; }

    /* DASHBOARD */
    #dashboard { display: none; }
    .topbar {
      background: #1a1612; padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h1 { font-size: 16px; color: #e8d48a; letter-spacing: 0.05em; }
    .topbar span { font-size: 12px; color: #8a7a6a; }
    .logout-btn {
      background: none; border: 1px solid #5a4d42; color: #8a7a6a;
      padding: 6px 14px; font-size: 12px; cursor: pointer;
    }
    .logout-btn:hover { border-color: #c8a84b; color: #c8a84b; }

    .stats-bar {
      background: #2a2420; padding: 24px 32px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 32px; font-weight: 700; color: #c8a84b; }
    .stat-label { font-size: 11px; color: #8a7a6a; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

    .controls {
      padding: 20px 32px; display: flex; gap: 12px; align-items: center;
      background: #f5f0e8; border-bottom: 1px solid #e8e0d0;
    }
    .controls select, .controls input {
      padding: 8px 12px; border: 1px solid #c0b0a0; background: white;
      font-size: 13px; color: #1a1612; outline: none;
    }
    .controls select:focus, .controls input:focus { border-color: #c8a84b; }

    .results-grid { padding: 24px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

    .result-card {
      background: white; border: 1px solid #e8e0d0;
      padding: 24px; position: relative;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .card-name { font-size: 16px; font-weight: 600; color: #1a1612; }
    .card-email { font-size: 12px; color: #8a7a6a; margin-top: 2px; }
    .card-date { font-size: 11px; color: #b0a090; }

    .states-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .state-badge {
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .state-badge.head { background: rgba(107,76,138,0.1); color: #6b4c8a; }
    .state-badge.feet { background: rgba(42,107,90,0.1); color: #2a6b5a; }
    .state-badge.synced { background: rgba(200,168,75,0.15); color: #7a5e1a; }
    .state-badge.unsynced { background: rgba(180,60,40,0.1); color: #8b3a2a; }

    .score-bars { margin-bottom: 16px; }
    .score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .score-name { font-size: 11px; color: #8a7a6a; width: 130px; flex-shrink: 0; }
    .score-bar-bg { flex: 1; height: 6px; background: #f0e8e0; border-radius: 3px; }
    .score-bar-fill { height: 100%; border-radius: 3px; }
    .score-val { font-size: 11px; color: #5a4d42; width: 30px; text-align: right; }

    .context-text {
      font-size: 12px; color: #5a4d42; font-style: italic;
      padding: 10px 12px; background: #f8f4ee; border-left: 3px solid #c8a84b;
      margin-bottom: 12px;
    }

    .transcript-toggle {
      font-size: 12px; color: #c8a84b; cursor: pointer; text-decoration: underline;
      background: none; border: none; padding: 0;
    }
    .transcript-body {
      display: none; margin-top: 12px; font-size: 12px; line-height: 1.7;
      color: #5a4d42; padding: 12px; background: #f8f4ee;
      border: 1px solid #e8e0d0; white-space: pre-wrap;
    }

    .empty-state { text-align: center; padding: 80px 32px; color: #8a7a6a; }
    .loading { text-align: center; padding: 80px; color: #8a7a6a; }

    @media (max-width: 768px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .results-grid { grid-template-columns: 1fr; padding: 16px; }
      .controls { flex-wrap: wrap; padding: 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>Admin Dashboard</h1>
    <p>Marathon of Imperative Synchronization</p>
    <input type="password" id="token-input" placeholder="Enter admin token" onkeydown="if(event.key==='Enter') login()">
    <button class="login-btn" onclick="login()">Access Dashboard</button>
    <p class="login-error" id="login-error">Invalid token. Please try again.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <h1>MARATHON ASSESSMENT — ADMIN</h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="last-updated"></span>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total Completions</div></div>
    <div class="stat"><div class="stat-num" id="stat-synced">—</div><div class="stat-label">In Sync</div></div>
    <div class="stat"><div class="stat-num" id="stat-balanced">—</div><div class="stat-label">Balanced Head</div></div>
    <div class="stat"><div class="stat-num" id="stat-marathon">—</div><div class="stat-label">Marathon Pace</div></div>
  </div>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Search by name or email..." oninput="renderCards()" style="min-width:200px;">
    <select id="head-filter" onchange="renderCards()">
      <option value="">All Head States</option>
      <option value="Front-Heavy">Front-Heavy</option>
      <option value="Back-Heavy">Back-Heavy</option>
      <option value="Balanced">Balanced</option>
    </select>
    <select id="feet-filter" onchange="renderCards()">
      <option value="">All Feet States</option>
      <option value="Fast-Pace">Fast-Pace</option>
      <option value="Slow-Pace">Slow-Pace</option>
      <option value="Marathon-Pace">Marathon-Pace</option>
    </select>
    <select id="sync-filter" onchange="renderCards()">
      <option value="">All Sync Status</option>
      <option value="synced">In Sync</option>
      <option value="unsynced">Out of Sync</option>
    </select>
  </div>

  <div id="results-container" class="results-grid">
    <div class="loading">Loading results...</div>
  </div>
</div>

<script>
  const ADMIN_TOKEN = 'Mandy2025$';
  let allResults = [];

  function login() {
    const val = document.getElementById('token-input').value;
    if (val === ADMIN_TOKEN) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadResults();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('token-input').value = '';
    document.getElementById('login-error').style.display = 'none';
  }

  async function loadResults() {
    try {
      const res = await fetch('/.netlify/functions/results?token=' + encodeURIComponent(ADMIN_TOKEN));
      const data = await res.json();
      allResults = data.results || [];
      // Map blob data fields to admin card fields
      allResults = allResults.map(r => ({
        name: r.name || '',
        email: r.email || '',
        head: r.head?.state || r.head || '',
        feet: r.feet?.state || r.feet || '',
        context: r.context || '',
        transcript: r.transcript || '',
        timestamp: r.timestamp || '',
        rawScores: r.rawScores || {}
      }));
      updateStats();
      renderCards();
      document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById('results-container').innerHTML =
        '<div class="empty-state">No results found or unable to load data.</div>';
    }
  }

  function updateStats() {
    const total = allResults.length;
    const synced = allResults.filter(r => r.head === 'Balanced' && r.feet === 'Marathon-Pace').length;
    const balanced = allResults.filter(r => r.head === 'Balanced').length;
    const marathon = allResults.filter(r => r.feet === 'Marathon-Pace').length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-synced').textContent = synced;
    document.getElementById('stat-balanced').textContent = balanced;
    document.getElementById('stat-marathon').textContent = marathon;
  }

  function renderCards() {
    const search = document.getElementById('search-input').value.toLowerCase();
    const headF = document.getElementById('head-filter').value;
    const feetF = document.getElementById('feet-filter').value;
    const syncF = document.getElementById('sync-filter').value;

    let filtered = allResults.filter(r => {
      const matchSearch = !search || (r.name||'').toLowerCase().includes(search) || (r.email||'').toLowerCase().includes(search);
      const matchHead = !headF || r.head === headF;
      const matchFeet = !feetF || r.feet === feetF;
      const isSynced = r.head === 'Balanced' && r.feet === 'Marathon-Pace';
      const matchSync = !syncF || (syncF === 'synced' ? isSynced : !isSynced);
      return matchSearch && matchHead && matchFeet && matchSync;
    });

    if (filtered.length === 0) {
      document.getElementById('results-container').innerHTML =
        '<div class="empty-state">No results match your filters.</div>';
      return;
    }

    const html = filtered.map((r, i) => {
      const isSynced = r.head === 'Balanced' && r.feet === 'Marathon-Pace';
      const scores = r.rawScores || {};
      const date = r.timestamp ? new Date(r.timestamp).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';

      const bars = [
        { name: 'Front-Heavy Head', key: 'front_heavy', color: '#8b3a2a' },
        { name: 'Back-Heavy Head', key: 'back_heavy', color: '#b0803a' },
        { name: 'Balanced Head', key: 'balanced_head', color: '#6b4c8a' },
        { name: 'Fast-Pace Feet', key: 'fast_pace', color: '#8b3a2a' },
        { name: 'Slow-Pace Feet', key: 'slow_pace', color: '#b0803a' },
        { name: 'Marathon-Pace Feet', key: 'marathon_pace', color: '#2a6b5a' },
      ].map(b => {
        const val = scores[b.key] || 0;
        const pct = Math.round((val / 15) * 100);
        return `<div class="score-row">
          <span class="score-name">${b.name}</span>
          <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%;background:${b.color};"></div></div>
          <span class="score-val">${val}/15</span>
        </div>`;
      }).join('');

      const contextHtml = r.context ? `<div class="context-text">"${r.context}"</div>` : '';
      const transcriptHtml = r.transcript ? `
        <button class="transcript-toggle" onclick="toggleTranscript(${i})">View transcript ▾</button>
        <div class="transcript-body" id="transcript-${i}">${r.transcript}</div>` : '';

      return `<div class="result-card">
        <div class="card-header">
          <div>
            <div class="card-name">${r.name || 'Anonymous'}</div>
            <div class="card-email">${r.email || ''}</div>
          </div>
          <div class="card-date">${date}</div>
        </div>
        <div class="states-row">
          <span class="state-badge head">${r.head || '—'} Head</span>
          <span class="state-badge feet">${r.feet || '—'} Feet</span>
          <span class="state-badge ${isSynced ? 'synced' : 'unsynced'}">${isSynced ? '✦ In Sync' : 'Out of Sync'}</span>
        </div>
        <div class="score-bars">${bars}</div>
        ${contextHtml}
        ${transcriptHtml}
      </div>`;
    }).join('');

    document.getElementById('results-container').innerHTML = html;
  }

  function toggleTranscript(i) {
    const el = document.getElementById('transcript-' + i);
    const btn = el.previousElementSibling;
    if (el.style.display === 'block') {
      el.style.display = 'none';
      btn.textContent = 'View transcript ▾';
    } else {
      el.style.display = 'block';
      btn.textContent = 'Hide transcript ▴';
    }
  }
</script>
</body>
</html>
