<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marathon Assessment — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0d;
      --surface: #1a1916;
      --surface2: #232220;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #f0ede8;
      --muted: #8a8780;
      --accent: #c9a96e;
      --accent-dim: rgba(201,169,110,0.12);
      --green: #4caf7d;
      --green-dim: rgba(76,175,125,0.12);
      --red: #e06c6c;
      --red-dim: rgba(224,108,108,0.12);
      --amber: #e5a84a;
      --amber-dim: rgba(229,168,74,0.12);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.25rem;
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    .logo span {
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      margin-left: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 73px);
      padding: 2rem;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }

    .login-card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      padding: 0.65rem 1rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1rem;
    }

    input:focus { border-color: var(--accent); }

    button.primary {
      width: 100%;
      background: var(--accent);
      color: #0f0e0d;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.7rem 1.5rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.primary:hover { opacity: 0.88; }

    .error-msg {
      color: var(--red);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }

    #dashboard { display: none; padding: 2rem 2.5rem; max-width: 1200px; margin: 0 auto; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.4rem;
    }

    .stat-value {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1;
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .results-count {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .results-list { display: flex; flex-direction: column; gap: 1rem; }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .result-card:hover { border-color: var(--border2); }

    .result-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      cursor: pointer;
      user-select: none;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(201,169,110,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    .result-meta { flex: 1; min-width: 0; }

    .result-name {
      font-weight: 500;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-time {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }

    .badge {
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .badge-balanced { background: var(--green-dim); color: var(--green); }
    .badge-front { background: var(--red-dim); color: var(--red); }
    .badge-back { background: var(--amber-dim); color: var(--amber); }
    .badge-marathon { background: var(--green-dim); color: var(--green); }
    .badge-fast { background: var(--red-dim); color: var(--red); }
    .badge-slow { background: var(--amber-dim); color: var(--amber); }

    .chevron {
      color: var(--muted);
      font-size: 1.1rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .result-card.open .chevron { transform: rotate(180deg); }

    .result-body {
      display: none;
      padding: 0 1.5rem 1.5rem;
      border-top: 1px solid var(--border);
    }

    .result-card.open .result-body { display: block; }

    .scores-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1rem 0;
    }

    .score-section { }

    .score-section-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.5rem;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .score-name {
      font-size: 0.78rem;
      color: var(--muted);
      width: 100px;
      flex-shrink: 0;
    }

    .score-bar-wrap {
      flex: 1;
      height: 5px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-bar {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    .score-num {
      font-size: 0.75rem;
      color: var(--muted);
      width: 28px;
      text-align: right;
    }

    .context-block {
      background: var(--surface2);
      border-left: 2px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
    }

    .transcript-block {
      margin-top: 1rem;
    }

    .transcript-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.5rem;
    }

    .transcript-text {
      font-size: 0.875rem;
      line-height: 1.75;
      color: #c8c5bf;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .empty-state h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      header { padding: 1rem 1.25rem; }
      #dashboard { padding: 1.25rem; }
      .scores-grid { grid-template-columns: 1fr; }
      .badges { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">The Marathon <span>Admin</span></div>
</header>

<div id="login-screen">
  <div class="login-card">
    <h2>Results Dashboard</h2>
    <p>Enter your admin token to view assessment results.</p>
    <input type="password" id="token-input" placeholder="Admin token" />
    <div class="error-msg" id="error-msg">Invalid token. Please try again.</div>
    <button class="primary" onclick="loadResults()">View Results</button>
  </div>
</div>

<div id="dashboard">
  <div class="stats-row" id="stats-row"></div>
  <div class="controls">
    <select id="filter-head" onchange="renderResults()">
      <option value="">All head states</option>
      <option value="Balanced">Balanced Head</option>
      <option value="Front-Heavy">Front-Heavy</option>
      <option value="Back-Heavy">Back-Heavy</option>
    </select>
    <select id="filter-feet" onchange="renderResults()">
      <option value="">All feet states</option>
      <option value="Marathon-Pace">Marathon-Pace</option>
      <option value="Fast-Pace">Fast-Pace</option>
      <option value="Slow-Pace">Slow-Pace</option>
    </select>
    <span class="results-count" id="results-count"></span>
  </div>
  <div class="results-list" id="results-list"></div>
</div>

<script>
  let allResults = [];

  document.getElementById('token-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadResults();
  });

  async function loadResults() {
    const token = document.getElementById('token-input').value.trim();
    if (!token) return;

    const list = document.getElementById('results-list');
    list.innerHTML = '<div class="loading">Loading results…</div>';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    try {
      const res = await fetch(`/api/results?token=${encodeURIComponent(token)}`);
      if (res.status === 401) {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('error-msg').style.display = 'block';
        return;
      }
      const data = await res.json();
      allResults = data.results || [];
      renderStats();
      renderResults();
    } catch (err) {
      list.innerHTML = '<div class="loading">Failed to load results. Check console.</div>';
    }
  }

  function renderStats() {
    const total = allResults.length;
    const balanced = allResults.filter(r => r.head?.state === 'Balanced').length;
    const marathon = allResults.filter(r => r.feet?.state === 'Marathon-Pace').length;
    const both = allResults.filter(r => r.head?.state === 'Balanced' && r.feet?.state === 'Marathon-Pace').length;

    document.getElementById('stats-row').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total taken</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Balanced head</div><div class="stat-value">${balanced}</div></div>
      <div class="stat-card"><div class="stat-label">Marathon pace</div><div class="stat-value">${marathon}</div></div>
      <div class="stat-card"><div class="stat-label">Fully synced</div><div class="stat-value">${both}</div></div>
    `;
  }

  function renderResults() {
    const hf = document.getElementById('filter-head').value;
    const ff = document.getElementById('filter-feet').value;

    let filtered = allResults.filter(r => {
      if (hf && r.head?.state !== hf) return false;
      if (ff && r.feet?.state !== ff) return false;
      return true;
    });

    document.getElementById('results-count').textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''}`;

    if (!filtered.length) {
      document.getElementById('results-list').innerHTML = `
        <div class="empty-state">
          <h3>No results yet</h3>
          <p>Results will appear here after someone completes the assessment.</p>
        </div>`;
      return;
    }

    document.getElementById('results-list').innerHTML = filtered.map((r, i) => {
      const name = r.name || 'Anonymous';
      const initials = name === 'Anonymous' ? '?' : name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      const date = new Date(r.timestamp).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      const headBadge = badgeClass(r.head?.state, 'head');
      const feetBadge = badgeClass(r.feet?.state, 'feet');

      const scores = r.rawScores || {};
      const headScores = [
        { label: 'Balanced', val: scores.balanced_head || 0 },
        { label: 'Front-Heavy', val: scores.front_heavy || 0 },
        { label: 'Back-Heavy', val: scores.back_heavy || 0 },
      ];
      const feetScores = [
        { label: 'Marathon-Pace', val: scores.marathon_pace || 0 },
        { label: 'Fast-Pace', val: scores.fast_pace || 0 },
        { label: 'Slow-Pace', val: scores.slow_pace || 0 },
      ];

      return `
        <div class="result-card" id="card-${i}">
          <div class="result-header" onclick="toggle(${i})">
            <div class="avatar">${initials}</div>
            <div class="result-meta">
              <div class="result-name">${name}</div>
              <div class="result-time">${date}</div>
            </div>
            <div class="badges">
              <span class="badge ${headBadge}">${r.head?.state || '—'}</span>
              <span class="badge ${feetBadge}">${r.feet?.state || '—'}</span>
            </div>
            <span class="chevron">▾</span>
          </div>
          <div class="result-body">
            ${r.context ? `<div class="context-block">"${r.context}"</div>` : ''}
            <div class="scores-grid">
              <div class="score-section">
                <div class="score-section-label">Head scores</div>
                ${headScores.map(s => scoreRow(s.label, s.val)).join('')}
              </div>
              <div class="score-section">
                <div class="score-section-label">Feet scores</div>
                ${feetScores.map(s => scoreRow(s.label, s.val)).join('')}
              </div>
            </div>
            ${r.transcript ? `
              <div class="transcript-block">
                <div class="transcript-label">Generated transcript</div>
                <div class="transcript-text">${r.transcript.replace(/\n\n/g, '<br><br>')}</div>
              </div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function scoreRow(label, val) {
    const pct = Math.round((val / 15) * 100);
    return `
      <div class="score-row">
        <span class="score-name">${label}</span>
        <div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%"></div></div>
        <span class="score-num">${val}/15</span>
      </div>`;
  }

  function badgeClass(state, type) {
    if (!state) return '';
    if (state === 'Balanced') return 'badge-balanced';
    if (state === 'Front-Heavy') return 'badge-front';
    if (state === 'Back-Heavy') return 'badge-back';
    if (state === 'Marathon-Pace') return 'badge-marathon';
    if (state === 'Fast-Pace') return 'badge-fast';
    if (state === 'Slow-Pace') return 'badge-slow';
    return '';
  }

  function toggle(i) {
    document.getElementById(`card-${i}`).classList.toggle('open');
  }
</script>
</body>
</html>
